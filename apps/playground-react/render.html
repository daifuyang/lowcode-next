<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Lowcode Next · Render</title>
    <!--
      消费端自己的全局样式。

      这里**不引**编辑器皮肤（`@pg/styles.css` 的 Tailwind preflight + shadcn 令牌）——
      render 态不该背编辑器的样式负担，这也是它比编辑态轻三倍的原因之一。
      物料自带的 `materials/styles.css` 由 `render-react` 内部引入，不用在这里写。
    -->
    <style>
      html,
      body,
      #root {
        height: 100%;
      }
      body {
        margin: 0;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        font-size: 14px;
        line-height: 1.5;
        color: #1f2329;
        -webkit-font-smoothing: antialiased;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/render.tsx"></script>
  </body>
</html>
